<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSK IPA 2026 - KKG Ngasem</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fc;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        
        .quiz-container { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            position: relative;
        }

        .logo-header { 
            display: block; 
            margin: 0 auto 15px; 
            max-width: 90px; 
            height: auto; 
        }

        #timer-wrapper { 
            background: var(--primary); 
            color: white; 
            padding: 8px 15px; 
            border-radius: 20px; 
            text-align: center; 
            font-size: 1.1rem; 
            font-weight: bold; 
            display: inline-block;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .question-image { 
            display: block; 
            max-width: 250px; 
            height: auto; 
            margin: 15px auto; 
            border-radius: 8px; 
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .passage { 
            background: #f1f3f9; 
            padding: 15px; 
            border-left: 5px solid var(--accent); 
            margin-bottom: 20px; 
            line-height: 1.6;
            font-size: 0.95rem;
            border-radius: 4px;
        }

        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; color: var(--primary); line-height: 1.5; }

        .option { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            background: white; 
            cursor: pointer; 
            transition: 0.2s;
            font-size: 1rem;
        }

        .option:hover { background: #f0f7ff; border-color: var(--accent); }
        .option.selected { background: var(--accent); color: white; border-color: var(--accent); }

        .btn-group { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; flex: 1; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #95a5a6; color: white; max-width: 120px; }

        .nav-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); 
            gap: 6px; 
            margin-top: 30px; 
            padding-top: 20px; 
            border-top: 1px solid #eee;
        }

        .nav-num { 
            height: 38px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.85rem;
            background: white;
        }

        .nav-num.answered { background: var(--success); color: white; border-color: var(--success); }
        .nav-num.current { border: 2px solid var(--primary); font-weight: bold; transform: scale(1.05); }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 1rem;
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            #timer-wrapper { position: static; display: block; margin-bottom: 15px; }
            .question-image { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="login-screen">
        <img src="https://awsimages.detik.net.id/community/media/visual/2023/05/02/lambang-tut-wuri-handayani.png?w=700&q=90" class="logo-header" alt="Logo">
        <h2 style="text-align:center; color: var(--primary); margin: 0;">SELEKSI OSK IPA TAHUN 2026</h2>
        <h4 style="text-align:center; color: var(--secondary); margin: 5px 0 20px 0;">KKG KELAS KECAMATAN NGASEM</h4>
        <hr>
        <p style="text-align:center;">Waktu: <b>20 Menit</b> | Total: <b>40 Soal</b></p>
        <input type="text" id="username" placeholder="Masukkan Nama Lengkap Anda...">
        <button class="btn btn-primary" style="width:100%" onclick="startQuiz()">Mulai Ujian</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer-wrapper">Sisa: <span id="timer-display">20:00</span></div>
        <div id="progress" style="margin-bottom:15px; font-weight:bold; color: var(--accent);"></div>
        
        <div id="passage-box" class="passage hidden"></div>
        <img id="image-box" class="question-image hidden" src="">
        <div id="question-box" class="question-text"></div>
        <div id="options-box"></div>
        
        <div class="btn-group">
            <button id="prev-btn" class="btn btn-secondary" onclick="prevQuestion()">Kembali</button>
            <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()">Lanjut</button>
        </div>
        <div class="nav-grid" id="nav-grid"></div>
    </div>

    <div id="result-screen" class="hidden" style="text-align:center">
        <img src="https://awsimages.detik.net.id/community/media/visual/2023/05/02/lambang-tut-wuri-handayani.png?w=700&q=90" class="logo-header" alt="Logo">
        <h2>Ujian Selesai!</h2>
        <p>Skor Anda:</p>
        <h1 id="final-score" style="font-size: 5rem; color: var(--success); margin: 10px 0;">0</h1>
        <p id="status-upload" style="font-weight:bold;"></p>
        <button class="btn btn-primary" style="max-width: 200px;" onclick="location.reload()">Selesai / Keluar</button>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbwf0FXcXIpurjkNAC05lXr0xk2w_sr-ei2TzTBKpQaxdsh3Abkb5-YlVQvH6M6rtPXH/exec";

    const quizData = [
        { q: "Nayla selalu sarapan dengan makanan yang bergizi. Organ tubuh Nayla yang bertugas untuk menyerap sari-sari makanan tersebut yaitu ….", options: {a: "lambung", b: "usus halus", c: "usus besar", d: "anus"}, ans: "b" },
        { q: "Contoh perubahan wujud menguap adalah . . . .", options: {a: "mentega yang dipanaskan", b: "kamfer dalam lemari", c: "air yang dipanaskan", d: "air yang didinginkan"}, ans: "c" },
        { q: "Faktor abiotik berikut yang berperan dalam fotosintesis adalah . . . .", options: {a: "nitrogen", b: "udara", c: "cahaya lampu", d: "cahaya matahari"}, ans: "d" },
        { q: "Berbagai jenis zat atau nutrisi dalam makanan diperlukan oleh tubuh, salah satunya adalah lemak. Lemak berguna untuk….", options: {a: "membantu tubuh agar tetap hangat", b: "pertumbuhan dan perbaikan tubuh", c: "melawan kuman penyakit", d: "mempermudah buang air besar"}, ans: "a" },
        { q: "Tumbuhan merupakan makhluk hidup karena dapat membuat makanannya sendiri melalui proses...", options: {a: "pernapasan", b: "fotosintesis", c: "reproduksi", d: "penyerapan air"}, ans: "b" },
        { q: "Bebek memiliki kaki berselaput, yang berfungsi untuk...", options: {a: "memanjat pohon", b: "menangkap mangsa", c: "berenang di air", d: "berlari cepat"}, ans: "c" },
        { q: "Katak mengalami metamorfosis sempurna. Urutan siklus hidup katak yang benar adalah...", options: {a: "telur → katak dewasa → berudu → katak muda", b: "telur → berudu → katak muda → katak dewasa", c: "telur → katak muda → berudu → katak dewasa", d: "berudu → telur → katak muda → katak dewasa"}, ans: "b" },
        { q: "Bagian terkecil penyusun makhluk hidup disebut...", options: {a: "organ", b: "jaringan", c: "sel", d: "sistem organ"}, ans: "c" },
        { q: "Pencegahan penyakit yang disebabkan oleh virus/bakteri dapat dilakukan melalui pemberian …", options: {a: "antibiotik", b: "penisilin", c: "vaksin", d: "streptomisin"}, ans: "c" },
        { q: "Proses perubahan wujud yang melepaskan kalor terjadi pada nomor …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/b0524372-1ee6-40a2-aa83-2184157b0c6b-v2", options: {a: "1, 4, 6", b: "2, 5, 3", c: "1, 3, 5", d: "2, 4, 6"}, ans: "d" },
        { q: "Faktor yang dapat merangsang pelepasan empedu dari kantung empedu ke dalam usus halus adalah mengkonsumsi makanan ....", options: {a: "kaya vitamin dan serat", b: "kaya lemak", c: "kaya protein", d: "berpuasa seharian"}, ans: "b" },
        { q: "Bagian dari sistem saraf yang bertanggung jawab untuk mengatur kerja otot rangka adalah …", options: {a: "saraf otonom", b: "saraf simpatetik", c: "saraf parasimpatetik", d: "saraf somatik"}, ans: "d" },
        { q: "Biji kacang yang diletakkan di atas tisu berair akan menjadi kecambah. Hal ini menunjukkan?", options: {a: "perkembangbiakan", b: "perkembangan", c: "pertumbuhan primer", d: "pertumbuhan sekunder"}, ans: "c" },
        { q: "Ciri yang membedakan antara tumbuhan dan hewan adalah?", options: {a: "peka rangsang", b: "gerak aktif", c: "mampu membuat makanan sendiri", d: "Bernapas"}, ans: "c" },
        { q: "Ciri makhluk hidup yang berkaitan erat dengan usaha mempertahankan jenisnya adalah?", options: {a: "peka rangsang", b: "memerlukan makan", c: "berkembangbiak", d: "bergerak"}, ans: "c" },
        { q: "Proses pengeluaran zat sisa metabolisme agar tidak meracuni tubuh disebut?", options: {a: "respirasi", b: "transpirasi", c: "ekskresi", d: "transportasi"}, ans: "c" },
        { q: "Perpindahan kalor yang terjadi pada gambar di atas secara berturut-turut adalah…", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/a39babdc-b13b-4d38-bd86-356cbb971c55-v2", options: {a: "konduksi, konveksi, radiasi", b: "konduksi, konveksi, hilirisasi", c: "konveksi, konduksi, radiasi", d: "radiasi, konduksi, konveksi"}, ans: "d" },
        { q: "Edo sedang melakukan percobaan dengan cara memasukkan sebuah bola besi panas ke dalam sebuah wadah berisi air dingin, hal yang terjadi adalah….", options: {a: "bola besi panas menjadi dingin", b: "air dalam wadah menguap", c: "bola besi turun suhu, air naik suhu hingga setimbang", d: "suhu keduanya tetap"}, ans: "c" },
        { q: "Dara menyetrika baju dan Raka memompa ban. Energi yang dimanfaatkan adalah?", options: {a: "listrik-panas & gerak-angin", b: "gerak-panas & gerak-angin", c: "listrik-gerak & angin-gerak", d: "gerak-angin & listrik-panas"}, ans: "a" },
        { q: "Peternak sapi memanfaatkan kotoran sapi untuk energi alternatif berupa …", options: {a: "biodiesel", b: "biogas", c: "asetilen", d: "elpiji"}, ans: "b" },
        { q: "Contoh simbiosis komensalisme yang benar adalah ….", options: {a: "bakteri usus", b: "anggrek dan pohon inang", c: "cacing kremi", d: "benalu"}, ans: "b" },
        { q: "Minyak pelumas yang dioleskan pada rantai kendaraan bertujuan untuk …", options: {a: "memperlambat", b: "memperlicin ban", c: "memperkecil gaya gesek", d: "memperbesar gaya gesek"}, ans: "c" },
        { q: "Benda dapat tarik menarik apabila benda tersebut menerima gaya ...", options: {a: "magnet", b: "logam", c: "kayu", d: "kertas"}, ans: "a" },
        { q: "Kelenjar ludah manusia menghasilkan enzim ptialin yang berfungsi …", options: {a: "mengubah protein", b: "mengendapkan susu", c: "mengubah zat tepung menjadi gula", d: "mengasamkan"}, ans: "c" },
        { q: "Senyawa berikut dapat langsung diserap oleh usus halus, kecuali ….", options: {a: "asam amino", b: "vitamin B12", c: "glukosa", d: "lemak kompleks"}, ans: "d" },
        { q: "Dalam ekosistem sawah: Padi →tikus → ular → elang. Jika ular musnah, maka ....", options: {a: "Padi meningkat", b: "Padi menurun karena tikus meningkat", c: "Elang meningkat", d: "Tikus menurun"}, ans: "b" },
        { q: "The part of the circuit that can disconnect and connect electricity namely ....", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/740733f1-f89c-4c63-ab48-cd2aaddbdb7b-v2", options: {a: "Baterai", b: "Saklar", c: "Kabel", d: "Lampu"}, ans: "b" },
        { passage: "1) Air menjadi es. <br>2) Baju basah mengering. <br>3) Mentega meleleh. <br>4) Kapur barus mengecil.", q: "Perubahan wujud yang melepaskan kalor adalah….", options: {a: "(1) saja", b: "(1) dan (3)", c: "(2) dan (4)", d: "(3) dan (4)"}, ans: "a" },
        { q: "Hewan peliharaan yang berjemur di lampu penghangat dan memiliki lembaran sisik termasuk kelas….", options: {a: "Pisces", b: "Amphibia", c: "Reptilia", d: "Mamalia"}, ans: "c" },
        { q: "Berdasarkan gambar, proses konversi energi yang tepat adalah …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/fa41e0ed-d315-499e-993e-a3f84a37e3de-v2", options: {a: "Kimia-Panas-Kinetik-Listrik", b: "Panas-Uap-Kinetik-Listrik", c: "Kimia-Panas-Potensial-Kinetik-Listrik", d: "Listrik-Kinetik-Panas"}, ans: "c" },
        { q: "Pernyataan yang tepat mengenai massa jenis dari gambar adalah …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/fa41e0ed-d315-499e-993e-a3f84a37e3de-v2", options: {a: "Benda > Cairan", b: "Benda = Cairan", c: "Air < Minyak", d: "Minyak < Air"}, ans: "d" },
        { q: "Enzim dalam mulut berfungsi untuk . . . .", options: {a: "Protein ke pepton", b: "Protein susu", c: "Zat tepung ke gula", d: "Mengasamkan"}, ans: "c" },
        { q: "Kemampuan kelelawar menggunakan sistem sonar disebut ...", options: {a: "Adaptasi", b: "Mimikri", c: "Ekolokasi", d: "Autotomi"}, ans: "c" },
        { q: "Fungsi utama daun kaktus berbentuk duri adalah….", options: {a: "Fotosintesis", b: "Mengurangi penguapan", c: "Menyimpan air", d: "Menarik serangga"}, ans: "b" },
        { q: "Lapisan atmosfer bumi yang terdapat lapisan ozon adalah ...", options: {a: "Troposfer", b: "Eksosfer", c: "Stratosfer", d: "Mesosfer"}, ans: "c" },
        { q: "Tumbuhan yang berkembang biak dengan cara tunas adalah….", options: {a: "Mangga", b: "Pisang", c: "Jagung", d: "Kaktus"}, ans: "b" },
        { q: "Dua makhluk hidup yang mempunyai hubungan predasi yaitu ...", options: {a: "Tikus dan kucing", b: "Ular dan landak", c: "Semut dan kupu", d: "Tali putri"}, ans: "a" },
        { q: "Pertukaran oksigen dan karbondioksida terjadi pada …. ", options: {a: "Tekak", b: "Hidung", c: "Alveolus", d: "Bronkus"}, ans: "c" },
        { q: "Menimbun bagian cabang ke dalam tanah untuk perkembangbiakan disebut …. ", options: {a: "Merunduk", b: "Okulasi", c: "Stek", d: "Mengenten"}, ans: "a" },
        { q: "Bagian darah yang bertugas mengedarkan sari-sari makanan adalah …. ", options: {a: "Sel darah merah", b: "Plasma darah", c: "Keping darah", d: "Sel darah putih"}, ans: "b" }
    ];

    let currentIdx = 0, userName = "", timeLeft = 20 * 60;
    let userAnswers = new Array(quizData.length).fill(null);
    let timerInterval;

    function startQuiz() {
        userName = document.getElementById('username').value.trim();
        if(!userName) return alert("Isi nama terlebih dahulu!");
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTimer();
        initGrid();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("Waktu habis!"); showResult(); }
        }, 1000);
    }

    function initGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        quizData.forEach((_, i) => {
            const el = document.createElement('div');
            el.className = 'nav-num';
            el.id = `nav-${i}`;
            el.innerText = i + 1;
            el.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(el);
        });
    }

    function loadQuestion() {
        const data = quizData[currentIdx];
        document.getElementById('progress').innerText = `SOAL NO. ${currentIdx + 1}`;
        
        const iBox = document.getElementById('image-box');
        if(data.image) {
            iBox.src = data.image;
            iBox.classList.remove('hidden');
        } else { iBox.classList.add('hidden'); }

        const pBox = document.getElementById('passage-box');
        if(data.passage) { pBox.innerHTML = data.passage; pBox.classList.remove('hidden'); }
        else { pBox.classList.add('hidden'); }

        document.getElementById('question-box').innerHTML = data.q;

        const oBox = document.getElementById('options-box');
        oBox.innerHTML = "";
        for(let key in data.options) {
            const btn = document.createElement('button');
            btn.className = 'option' + (userAnswers[currentIdx] === key ? ' selected' : '');
            btn.innerHTML = `<strong>${key.toUpperCase()}.</strong> ${data.options[key]}`;
            btn.onclick = () => {
                userAnswers[currentIdx] = key;
                document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                updateGridStyles();
            };
            oBox.appendChild(btn);
        }

        document.getElementById('prev-btn').style.visibility = (currentIdx === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = (currentIdx === quizData.length - 1) ? "Kumpulkan" : "Lanjut";
        updateGridStyles();
    }

    function updateGridStyles() {
        quizData.forEach((_, i) => {
            const el = document.getElementById(`nav-${i}`);
            if(el) {
                el.classList.remove('current', 'answered');
                if(i === currentIdx) el.classList.add('current');
                if(userAnswers[i] !== null) el.classList.add('answered');
            }
        });
    }

    function nextQuestion() {
        if(currentIdx < quizData.length - 1) { currentIdx++; loadQuestion(); }
        else { if(confirm("Kumpulkan jawaban sekarang?")) { clearInterval(timerInterval); showResult(); } }
    }

    function prevQuestion() { if(currentIdx > 0) { currentIdx--; loadQuestion(); } }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let correctCount = 0;
        userAnswers.forEach((ans, i) => { if(ans === quizData[i].ans) correctCount++; });
        let score = Math.round((correctCount / quizData.length) * 100);
        document.getElementById('final-score').innerText = score;

        if(DATABASE_URL) {
            document.getElementById('status-upload').innerText = "⏳ Mengirim nilai...";
            fetch(DATABASE_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name: userName, score: score })
            }).then(() => {
                document.getElementById('status-upload').innerText = "✅ Nilai Berhasil Terkirim!";
                document.getElementById('status-upload').style.color = "var(--success)";
            }).catch(() => {
                document.getElementById('status-upload').innerText = "⚠️ Gagal mengirim nilai.";
            });
        }
    }
</script>
</body>
</html>
