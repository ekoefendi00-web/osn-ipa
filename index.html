<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian OSN IPA - KKG Ngasem</title>
    <style>
        :root { 
            --primary: #4e73df; 
            --success: #1cc88a; 
            --danger: #e74a3b; 
            --bg: #f8f9fc; 
            --dark: #5a5c69; 
            --secondary: #858796; 
        }

        /* Perbaikan CSS Logo agar rapi di tengah */
        .logo-header {
            display: block;
            margin: 0 auto 15px auto;
            max-width: 100px;
            height: auto;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .quiz-container { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        .hidden { display: none !important; }
        
        #timer-wrapper { position: absolute; top: 20px; right: 30px; text-align: right; }
        #timer-display { font-size: 1.1rem; font-weight: bold; color: var(--danger); background: #fff1f0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--danger); }

        .passage { background: #f1f3f9; border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 20px; line-height: 1.6; font-size: 0.95rem; border-radius: 5px; color: #444; }
        .question-image { width: 100%; max-width: 400px; height: auto; display: block; margin: 20px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .question-text { font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; color: var(--dark); line-height: 1.6; }
        
        .option { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border: 2px solid #eaecf4; border-radius: 10px; background: white; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option:hover { border-color: var(--primary); background: #f8f9ff; }
        .option.selected { background: var(--primary); color: white; border-color: var(--primary); }

        .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee; }
        .nav-num { padding: 10px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: bold; background: white; color: #888; }
        .nav-num.current { border-color: var(--primary); background: #f0f4ff; color: var(--primary); border-width: 2px; }
        .nav-num.answered { background: var(--secondary); color: white; border-color: var(--secondary); }
        .nav-num.current.answered { background: var(--primary); color: white; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 2; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { flex: 1; background: var(--secondary); color: white; }
        input#username { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 2px solid #ddd; font-size: 1rem; box-sizing: border-box; }
    </style>
</head>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSK Bahasa Inggris 2026</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        
        .quiz-container { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }

        .logo-header { 
            display: block; 
            margin: 0 auto 15px; 
            max-width: 100px; 
            height: auto; 
        }

        /* Ukuran logo lebih kecil saat mengerjakan soal agar hemat ruang */
        #quiz-screen .logo-header { max-width: 70px; margin-bottom: 10px; }

        hr { border: 0; height: 1px; background: #ddd; margin: 20px 0; }
        .hidden { display: none; }

        #timer-wrapper { 
            background: var(--primary); 
            color: white; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-bottom: 20px;
        }

        .passage { 
            background: #f9f9f9; 
            padding: 15px; 
            border-left: 5px solid var(--accent); 
            margin-bottom: 20px; 
            line-height: 1.6;
        }

        .question-image { 
            display: block; 
            max-width: 100%; 
            height: auto; 
            margin: 15px auto; 
            border-radius: 8px; 
        }

        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; color: var(--primary); }

        .option { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            background: white; 
            cursor: pointer; 
            transition: 0.2s;
        }

        .option:hover { background: #f0f7ff; border-color: var(--accent); }
        .option.selected { background: var(--accent); color: white; border-color: var(--accent); }

        .btn-group { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #95a5a6; color: white; }

        .nav-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); 
            gap: 8px; 
            margin-top: 30px; 
            padding-top: 20px; 
            border-top: 1px solid #eee;
        }

        .nav-num { 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.9rem;
        }

        .nav-num.answered { background: var(--success); color: white; border-color: var(--success); }
        .nav-num.current { border: 2px solid var(--primary); font-weight: bold; transform: scale(1.1); }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="login-screen">
        <img src="https://awsimages.detik.net.id/community/media/visual/2023/05/02/lambang-tut-wuri-handayani.png?w=700&q=90" class="logo-header" alt="Logo">
        <h2 style="text-align:center; color: var(--primary); margin-top: 0;">SELEKSI OSK ILMU PENGETAHUAN ALAM (IPA) TAHUN 2026</h2>
        <h4 style="text-align:center; color: var(--secondary); margin-top:-10px;">KKG KELAS KECAMATAN NGASEM</h4>
        <hr>
        <p style="text-align:center;">Waktu: <b>20 Menit</b> | Total: <b>40 Soal</b></p>
        <input type="text" id="username" placeholder="Masukkan Nama Lengkap Anda...">
        <button class="btn btn-primary" style="width:100%" onclick="startQuiz()">Mulai Ujian</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <img src="https://awsimages.detik.net.id/community/media/visual/2023/05/02/lambang-tut-wuri-handayani.png?w=700&q=90" class="logo-header" alt="Logo">
        
        <div id="timer-wrapper"><div id="timer-display">20:00</div></div>
        <div id="progress" style="margin-bottom:15px; font-weight:bold; color: var(--primary);"></div>
        
        <div id="passage-box" class="passage hidden"></div>
        <img id="image-box" class="question-image hidden" src="">
        <div id="question-box" class="question-text"></div>
        <div id="options-box"></div>
        
        <div class="btn-group">
            <button id="prev-btn" class="btn btn-secondary" onclick="prevQuestion()">Kembali</button>
            <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()">Lanjut</button>
        </div>
        <div class="nav-grid" id="nav-grid"></div>
    </div>

    <div id="result-screen" class="hidden" style="text-align:center">
        <img src="https://awsimages.detik.net.id/community/media/visual/2023/05/02/lambang-tut-wuri-handayani.png?w=700&q=90" class="logo-header" alt="Logo">
        <h2>Selesai! Skor Anda:</h2>
        <h1 id="final-score" style="font-size: 5rem; color: var(--success);">0</h1>
        <p id="status-upload" style="font-weight:bold;"></p>
        <button class="btn btn-primary" onclick="location.reload()">Selesai / Keluar</button>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbwf0FXcXIpurjkNAC05lXr0xk2w_sr-ei2TzTBKpQaxdsh3Abkb5-YlVQvH6M6rtPXH/exec";

const quizData = [
    { q: "Nayla selalu sarapan dengan makanan yang bergizi. Organ tubuh Nayla yang bertugas untuk menyerap sari-sari makanan tersebut yaitu ….", options: {a: "lambung", b: "usus halus", c: "usus besar", d: "anus"}, ans: "b" },
    { q: "Perubahan wujud dengan cara menguap adalah . . . .", options: {a: "mentega yang dipanaskan", b: "kamfer dalam lemari", c: "air yang dipanaskan", d: "air yang didinginkan"}, ans: "c" },
    { q: "Faktor abiotik berikut yang berperan dalam fotosintesis adalah . . . .", options: {a: "Nitrogen", b: "udara", c: "cahaya lampu", d: "cahaya matahari"}, ans: "d" },
    { q: "Berbagai jenis zat atau nutrisi dalam makanan diperlukan oleh tubuh, salah satunya adalah lemak. Lemak berguna untuk….", options: {a: "Membantu tubuh agar tetap hangat", b: "Pertumbuhan dan perbaikan tubuh", c: "Melawan kuman penyakit", d: "Mempermudah buang air besar"}, ans: "a" },
    { q: "Tumbuhan disebut sebagai makhluk hidup ciptaan Tuhan karena dapat membuat makanannya sendiri melalui proses...", options: {a: "Pernapasan", b: "Fotosintesis", c: "Reproduksi", d: "Penyerapan air"}, ans: "b" },
    { q: "Bebek memiliki kaki berselaput. Fungsi kaki tersebut adalah untuk...", options: {a: "Memanjat pohon", b: "Menangkap mangsa", c: "Berenang di air", d: "Berlari cepat"}, ans: "c" },
    { q: "Katak mengalami metamorfosis lengkap. Urutan siklus hidup katak yang benar adalah...", options: {a: "Telur -> Katak dewasa -> Berudu", b: "Telur -> Berudu -> Katak muda -> Dewasa", c: "Telur -> Katak muda -> Berudu", d: "Berudu -> Telur -> Katak muda"}, ans: "b" },
    { q: "Bagian terkecil penyusun makhluk hidup disebut...", options: {a: "Organ", b: "Jaringan", c: "Sel", d: "Sistem organ"}, ans: "c" },
    { q: "Pencegahan penyakit yang disebabkan oleh virus/bakteri dapat dilakukan melalui pemberian …", options: {a: "antibiotik", b: "penisilin", c: "vaksin", d: "streptomisin"}, ans: "c" },
    { q: "Proses perubahan wujud yang melepaskan kalor (pendinginan) terjadi pada nomor …", options: {a: "Membeku, Mengkristal, Mengembun", b: "Mencair, Menguap, Menyublim", c: "1, 3, 5", d: "2, 4, 6"}, ans: "a" },
    { q: "Faktor yang dapat merangsang pelepasan empedu dari kantung empedu ke dalam usus halus adalah ….", options: {a: "makanan kaya vitamin", b: "makanan kaya lemak", c: "makanan kaya protein", d: "berpuasa"}, ans: "b" },
    { q: "Bagian dari sistem saraf yang bertanggung jawab untuk mengatur kerja otot rangka adalah …", options: {a: "Saraf otonom", b: "Saraf simpatetik", c: "Saraf parasimpatetik", d: "Saraf somatik"}, ans: "d" },
    { q: "Biji kacang yang diletakkan di atas tisu berair akan menjadi kecambah. Hal ini menunjukkan?", options: {a: "Perkembangbiakan", b: "Perkembangan", c: "Pertumbuhan primer", d: "Pertumbuhan sekunder"}, ans: "c" },
    { q: "Ciri yang membedakan antara tumbuhan dan hewan adalah?", options: {a: "Peka rangsang", b: "Gerak aktif", c: "Mampu membuat makanan sendiri", d: "Bernapas"}, ans: "c" },
    { q: "Ciri makhluk hidup yang berkaitan erat dengan usaha mempertahankan jenisnya adalah?", options: {a: "Peka rangsang", b: "Memerlukan makan", c: "Berkembangbiak", d: "Bergerak"}, ans: "c" },
    { q: "Proses pengeluaran zat sisa metabolisme agar tidak meracuni tubuh disebut?", options: {a: "Respirasi", b: "Transpirasi", c: "Ekskresi", d: "Transportasi"}, ans: "c" },
    { q: "Perpindahan kalor secara berturut-turut (melalui zat padat, aliran zat cair, pancaran) adalah…", options: {a: "konduksi, konveksi, radiasi", b: "konduksi, konveksi, hilirisasi", c: "konveksi, konduksi, radiasi", d: "radiasi, konveksi, konduksi"}, ans: "a" },
    { q: "Bola besi panas dimasukkan ke air dingin. Hal yang terjadi adalah…", options: {a: "Besi mendingin saja", b: "Air memanas saja", c: "Suhu besi turun, suhu air naik hingga sama", d: "Tidak ada perubahan"}, ans: "c" },
    { q: "Dara menyetrika (Listrik ke Panas) dan Raka memompa ban (Gerak ke Angin). Energi yang dimanfaatkan adalah?", options: {a: "Listrik-Panas & Gerak-Angin", b: "Gerak-Panas & Gerak-Angin", c: "Listrik-Gerak & Angin-Gerak", d: "Gerak-Angin & Listrik-Panas"}, ans: "a" },
    { q: "Peternak sapi memanfaatkan kotoran sapi untuk energi alternatif berupa …", options: {a: "Biodiesel", b: "Biogas", c: "Asetilen", d: "Elpiji"}, ans: "b" },
    { q: "Contoh simbiosis komensalisme yang benar adalah ….", options: {a: "Bakteri usus", b: "Anggrek dan pohon inang", c: "Cacing kremi", d: "Benalu"}, ans: "b" },
    { q: "Minyak pelumas yang dioleskan pada rantai kendaraan bertujuan untuk …", options: {a: "memperlambat", b: "memperlicin ban", c: "memperkecil gaya gesek", d: "memperbesar gaya gesek"}, ans: "c" },
    { q: "Benda dapat tarik menarik apabila benda tersebut dikenai gaya yaitu ...", options: {a: "magnet", b: "logam", c: "kayu", d: "kertas"}, ans: "a" },
    { q: "Lidah/Air liur dapat menghasilkan enzim ptialin yang berfungsi …", options: {a: "mengubah protein", b: "mengendapkan susu", c: "mengubah zat tepung menjadi gula", d: "mengasamkan"}, ans: "c" },
    { q: "Senyawa berikut dapat langsung diserap oleh usus halus, KECUALI ….", options: {a: "Asam amino", b: "Vitamin B12", c: "Glukosa", d: "Lemak kompleks (Asam lemak)"}, ans: "d" },
    { q: "Padi -> tikus -> ular -> elang. Jika ular musnah, maka ....", options: {a: "Padi meningkat", b: "Padi menurun (tikus banyak)", c: "Tikus habis", d: "Elang bertambah"}, ans: "b" },
    { q: "Accumulation of harmful substances in the highest trophic level is called ....", options: {a: "Bioaccumulation", b: "Biomagnification", c: "Bioremediation", d: "Eutrophication"}, ans: "b" },
    { q: "Kegiatan yang melepaskan kalor adalah nomor ….", options: {a: "(1) Es membeku", b: "(2) Menguap", c: "(3) Mencair", d: "(4) Menyublim"}, ans: "a" },
    { q: "Hewan berjemur di bawah lampu dan mengalami pergantian sisik (molting). Hewan ini termasuk kelas….", options: {a: "Pisces", b: "Amphibia", c: "Reptilia", d: "Mamalia"}, ans: "c" },
    { q: "Urutan konversi energi pada PLTU (Batu bara) yang benar adalah …", options: {a: "Kimia - Panas - Kinetik - Listrik", b: "Panas - Uap - Kinetik - Listrik", c: "Kimia - Panas - Potensial - Listrik", d: "Panas - Kimia - Kinetik - Listrik"}, ans: "a" },
    { q: "Minyak mengapung di atas air. Pernyataan yang tepat adalah …", options: {a: "massa jenis benda > cairan", b: "massa jenis benda = cairan", c: "massa jenis air < minyak", d: "massa jenis minyak < air"}, ans: "d" },
    { q: "Enzim dalam mulut berfungsi untuk . . . . .", options: {a: "Protein ke pepton", b: "Protein susu", c: "Zat tepung ke gula", d: "Mengasamkan"}, ans: "c" },
    { q: "Kemampuan kelelawar menggunakan sistem sonar disebut ...", options: {a: "Adaptasi", b: "Mimikri", c: "Ekolokasi", d: "Autotomi"}, ans: "c" },
    { q: "Fungsi utama daun kaktus berbentuk duri adalah….", options: {a: "Fotosintesis", b: "Mengurangi penguapan", c: "Menyimpan air", d: "Menarik serangga"}, ans: "b" },
    { q: "Lapisan atmosfer bumi yang terdapat lapisan ozon adalah ...", options: {a: "Troposfer", b: "Eksosfer", c: "Stratosfer", d: "Mesosfer"}, ans: "c" },
    { q: "Tumbuhan yang berkembang biak dengan cara tunas adalah….", options: {a: "Mangga", b: "Pisang", c: "Jagung", d: "Kaktus"}, ans: "b" },
    { q: "Dua makhluk hidup yang mempunyai hubungan predasi (mangsa-memangsa) yaitu ...", options: {a: "Tikus dan kucing", b: "Ular dan landak", c: "Semut dan kupu", d: "Tali putri"}, ans: "a" },
    { q: "Pertukaran oksigen dan karbondioksida terjadi pada …. ", options: {a: "Tekak", b: "Hidung", c: "Alveolus", d: "Bronkus"}, ans: "c" },
    { q: "Menimbun bagian cabang ke dalam tanah untuk perkembangbiakan disebut …. ", options: {a: "Merunduk", b: "Okulasi", c: "Stek", d: "Mengenten"}, ans: "a" },
    { q: "Bagian darah yang bertugas mengedarkan sari-sari makanan adalah …. ", options: {a: "Sel darah merah", b: "Plasma darah", c: "Keping darah", d: "Sel darah putih"}, ans: "b" }
];

    let currentIdx = 0, userName = "", timeLeft = 20 * 60;
    let userAnswers = new Array(quizData.length).fill(null);
    let timerInterval;

    function startQuiz() {
        userName = document.getElementById('username').value.trim();
        if(!userName) return alert("Silakan isi nama terlebih dahulu!");
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTimer();
        initGrid();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("Waktu habis!"); showResult(); }
        }, 1000);
    }

    function initGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        quizData.forEach((_, i) => {
            const el = document.createElement('div');
            el.className = 'nav-num';
            el.id = `nav-${i}`;
            el.innerText = i + 1;
            el.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(el);
        });
    }

    function loadQuestion() {
        const data = quizData[currentIdx];
        document.getElementById('progress').innerText = `SOAL ${currentIdx + 1} DARI ${quizData.length}`;
        
        const iBox = document.getElementById('image-box');
        if(data.image && data.image !== "") {
            iBox.src = data.image;
            iBox.classList.remove('hidden');
        } else {
            iBox.classList.add('hidden');
            iBox.src = "";
        }

        const pBox = document.getElementById('passage-box');
        if(data.passage) { pBox.innerHTML = data.passage; pBox.classList.remove('hidden'); }
        else { pBox.classList.add('hidden'); }

        document.getElementById('question-box').innerHTML = data.q;

        const oBox = document.getElementById('options-box');
        oBox.innerHTML = "";
        for(let key in data.options) {
            const btn = document.createElement('button');
            btn.className = 'option' + (userAnswers[currentIdx] === key ? ' selected' : '');
            btn.innerHTML = `<strong>${key.toUpperCase()}.</strong> ${data.options[key]}`;
            btn.onclick = () => {
                userAnswers[currentIdx] = key;
                document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                updateGridStyles();
            };
            oBox.appendChild(btn);
        }

        document.getElementById('prev-btn').style.visibility = (currentIdx === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = (currentIdx === quizData.length - 1) ? "Selesai" : "Lanjut";
        updateGridStyles();
    }

    function updateGridStyles() {
        quizData.forEach((_, i) => {
            const el = document.getElementById(`nav-${i}`);
            if(el) {
                el.classList.remove('current', 'answered');
                if(i === currentIdx) el.classList.add('current');
                if(userAnswers[i] !== null) el.classList.add('answered');
            }
        });
    }

    function nextQuestion() {
        if(currentIdx < quizData.length - 1) { currentIdx++; loadQuestion(); }
        else { if(confirm("Kumpulkan jawaban sekarang?")) { clearInterval(timerInterval); showResult(); } }
    }

    function prevQuestion() { if(currentIdx > 0) { currentIdx--; loadQuestion(); } }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let correctCount = 0;
        userAnswers.forEach((ans, i) => { if(ans === quizData[i].ans) correctCount++; });
        let score = Math.round((correctCount / quizData.length) * 100);
        document.getElementById('final-score').innerText = score;

        if(DATABASE_URL && DATABASE_URL.includes("script.google.com")) {
            document.getElementById('status-upload').innerText = "⏳ Sedang mengirim nilai...";
            fetch(DATABASE_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: userName, score: score })
            })
            .then(() => {
                document.getElementById('status-upload').innerText = "✅ Nilai Berhasil Terkirim!";
                document.getElementById('status-upload').style.color = "var(--success)";
            })
            .catch(() => {
                document.getElementById('status-upload').innerText = "⚠️ Nilai gagal dikirim ke server.";
                document.getElementById('status-upload').style.color = "var(--danger)";
            });
        }
    }
</script>
</body>
</html>
