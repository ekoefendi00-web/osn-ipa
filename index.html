        .nav-num.answered { background: var(--secondary); color: white; border-color: var(--secondary); }
        .nav-num.current.answered { background: var(--primary); color: white; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }

        input#username { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 2px solid #ddd; font-size: 1rem; box-sizing: border-box; }
    </style>
</head>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

            --primary: #2c3e50;

<body>

<div class="quiz-container">

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbwf0FXcXIpurjkNAC05lXr0xk2w_sr-ei2TzTBKpQaxdsh3Abkb5-YlVQvH6M6rtPXH/exec";

const quizData = [
    { q: "Nayla selalu sarapan dengan makanan yang bergizi. Organ tubuh Nayla yang bertugas untuk menyerap sari-sari makanan tersebut yaitu ….", options: {a: "lambung", b: "usus halus", c: "usus besar", d: "anus"}, ans: "b" },
    { q: "Contoh perubahan wujud menguap adalah . . . .", options: {a: "mentega yang dipanaskan", b: "kamfer dalam lemari", c: "air yang dipanaskan", d: "air yang didinginkan"}, ans: "c" },
    { q: "Faktor abiotik berikut yang berperan dalam fotosintesis adalah . . . .", options: {a: "nitrogen", b: "udara", c: "cahaya lampu", d: "cahaya matahari"}, ans: "d" },
    { q: "Berbagai jenis zat atau nutrisi dalam makanan diperlukan oleh tubuh, salah satunya adalah lemak. Lemak berguna untuk….", options: {a: "membantu tubuh agar tetap hangat", b: "pertumbuhan dan perbaikan tubuh", c: "melawan kuman penyakit", d: "mempermudah buang air besar"}, ans: "a" },
    { q: "Tumbuhan merupakan makhluk hidup karena dapat membuat makanannya sendiri melalui proses...", options: {a: "pernapasan", b: "fotosintesis", c: "reproduksi", d: "penyerapan air"}, ans: "b" },
    { q: "Bebek memiliki kaki berselaput, yang berfungsi untuk...", options: {a: "memanjat pohon", b: "menangkap mangsa", c: "berenang di air", d: "berlari cepat"}, ans: "c" },
    { q: "Katak mengalami metamorfosis sempurna. Urutan siklus hidup katak yang benar adalah...", options: {a: "telur → katak dewasa → berudu → katak muda", b: "telur → berudu → katak muda → katak dewasa", c: "telur → katak muda → berudu → katak dewasa", d: "berudu → telur → katak muda → katak dewasa"}, ans: "b" },
    { q: "Bagian terkecil penyusun makhluk hidup disebut...", options: {a: "organ", b: "jaringan", c: "sel", d: "sistem organ"}, ans: "c" },
    { q: "Pencegahan penyakit yang disebabkan oleh virus/bakteri dapat dilakukan melalui pemberian …", options: {a: "antibiotik", b: "penisilin", c: "vaksin", d: "streptomisin"}, ans: "c" },
    { q: "Proses perubahan wujud yang melepaskan kalor terjadi pada nomor …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/b0524372-1ee6-40a2-aa83-2184157b0c6b-v2", options: {a: "1, 4, 6", b: "2, 5, 3", c: "1, 3, 5", d: "2, 4, 6"}, ans: "d" },
    { q: "Faktor yang dapat merangsang pelepasan empedu dari kantung empedu ke dalam usus halus adalah mengkonsumsi makanan ....", options: {a: "kaya vitamin dan serat", b: "kaya lemak", c: "kaya protein", d: "berpuasa seharian"}, ans: "b" },
    { q: "Bagian dari sistem saraf yang bertanggung jawab untuk mengatur kerja otot rangka adalah …", options: {a: "saraf otonom", b: "saraf simpatetik", c: "saraf parasimpatetik", d: "saraf somatik"}, ans: "d" },
    { q: "Biji kacang yang diletakkan di atas tisu berair akan menjadi kecambah. Hal ini menunjukkan?", options: {a: "perkembangbiakan", b: "perkembangan", c: "pertumbuhan primer", d: "pertumbuhan sekunder"}, ans: "c" },
    { q: "Ciri yang membedakan antara tumbuhan dan hewan adalah?", options: {a: "peka rangsang", b: "gerak aktif", c: "mampu membuat makanan sendiri", d: "Bernapas"}, ans: "c" },
    { q: "Ciri makhluk hidup yang berkaitan erat dengan usaha mempertahankan jenisnya adalah?", options: {a: "peka rangsang", b: "memerlukan makan", c: "berkembangbiak", d: "bergerak"}, ans: "c" },
    { q: "Proses pengeluaran zat sisa metabolisme agar tidak meracuni tubuh disebut?", options: {a: "respirasi", b: "transpirasi", c: "ekskresi", d: "transportasi"}, ans: "c" },
    { q: "Perpindahan kalor yang terjadi pada gambar di atas secara berturut-turut adalah…", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/a39babdc-b13b-4d38-bd86-356cbb971c55-v2", options: {a: "konduksi, konveksi, radiasi", b: "konduksi, konveksi, hilirisasi", c: "konveksi, konduksi, radiasi", d: "radiasi, konduksi, konveksi"}, ans: "d" },
    { q: "Edo sedang melakukan percobaan dengan cara memasukkan sebuah bola besi panas ke dalam sebuah wadah berisi air dingin, hal yang terjadi adalah….", options: {a: "bola besi menjadi dingin seperti air dalam wadah", b: "air dalam wadah menjadi panas seperti bola besi", c: "bola besi turun suhunya, air dalam wadah naik suhunya sehingga keduanya memiliki suhu yang sama", d: "bola besi perlahan-lahan mendingin sehingga memiliki suhu yang sama dengan air dalam wadah"}, ans: "c" },
    { q: "Dara menyetrika baju dan Raka memompa ban. Energi yang dimanfaatkan adalah?", options: {a: "listrik-panas & gerak-angin", b: "gerak-panas & gerak-angin", c: "listrik-gerak & angin-gerak", d: "gerak-angin & listrik-panas"}, ans: "a" },
    { q: "Peternak sapi memanfaatkan kotoran sapi untuk energi alternatif berupa …", options: {a: "biodiesel", b: "biogas", c: "asetilen", d: "elpiji"}, ans: "b" },
    { q: "Contoh simbiosis komensalisme yang benar adalah ….", options: {a: "bakteri usus", b: "anggrek dan pohon inang", c: "cacing kremi", d: "benalu"}, ans: "b" },
    { q: "Minyak pelumas yang dioleskan pada rantai kendaraan bertujuan untuk …", options: {a: "memperlambat", b: "memperlicin ban", c: "memperkecil gaya gesek", d: "memperbesar gaya gesek"}, ans: "c" },
    { q: "Benda dapat tarik menarik apabila benda tersebut menerima gaya ...", options: {a: "magnet", b: "logam", c: "kayu", d: "kertas"}, ans: "a" },
    { q: "Kelenjar ludah manusia menghasilkan enzim ptialin yang berfungsi …", options: {a: "mengubah protein", b: "mengendapkan susu", c: "mengubah zat tepung menjadi gula", d: "mengasamkan"}, ans: "c" },
    { q: "Senyawa berikut dapat langsung diserap oleh usus halus, kecuali ….", options: {a: "asam amino", b: "vitamin B12", c: "glukosa", d: "lemak kompleks"}, ans: "d" },
    { q: "Dalam ekosistem sawah terjadi pola interaksi antar populasi dalam bentuk rantai makanan sebagai berikut: Padi →tikus → ular → elang. Apabila salah satu mata rantai kita musnahkan, misalnya ular, maka kemungkinan yang akan terjadi adalah ....", options: {a: "produktivitas padi meningkat karena terjadinya penurunan populasi tikus.", b: "produktivitas padi menurun karena terjadinya kepunahan pada populasi tikus.", c: "produktivitas padi menurun karena terjadi kepunahan populasi ular akan diikuti dengan penurunan jumlah populasi tikus", d: "produktivitas padi menurun karena kepunahan populasi ular akan diikuti dengan terjadinya peningkatan populasi tikus."}, ans: "b" },
    { q: "Niko and his friends made an electrical cicuit like the picture. The part of the circuit that can disconnect and connect and connect electricity namely ....", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/740733f1-f89c-4c63-ab48-cd2aaddbdb7b-v2", options: {a: "B1", b: "2", c: "3n", d: "4"}, ans: "b" },
    { passage: "<b> Perhatikan empat kegiatan yang berkaitan dengan perubahan wujud berikut: !<br>1) Air sirup disimpan ke dalam kulkas sehingga menjadi es. <br>2) Pakaian basah yang dijemur di bawah sinar matahari akan mongering. <br>3) Mentega diletakkan pada wajan panas untuk menumis sayuran. <br>4) Harum kapur barus tercium saat Sinta masuk ke kamar mandi. ", q: "Jenis perubahan wujud benda yang melepaskan kalor terdapat pada kegiatan nomor ….", options: {a: "(1) dan (2)", b: "(1) dan (3)", c: "(2) dan (4)", d: "(3) dan (4)"}, ans: "a" },
    { q: "Seorang anak memiliki seekor hewan peliharaan. Setelah mengamati hewan peliharaannya, anak tersebut melihat bahwa hewan itu sesekali berjemur di bawah lampu penghangat yang ada di kandangnya. Setelah beberapa minggu, anak tersebut menemukan lembaran sisik dalam kandang hewan peliharaannya. Hewan peliharaan anak tersebut termasuk dalam kelas….", options: {a: "Pisces", b: "Amphibia", c: "Reptilia", d: "Mamalia"}, ans: "c" },
    { q: "Berdasarkan gambar, proses konversi berikut ini yang paling tepat adalah …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/fa41e0ed-d315-499e-993e-a3f84a37e3de-v2", options: {a: "Kimia - Panas - Kinetik - Listrik", b: "Panas - Uap - Kinetik -Potensial-Listrik", c: "Kimia - Panas - Potensial - Kinetik -Listrik", d: "Panas - Kimia - Kinetik - Listrik"}, ans: "c" },
    { q: "Pernyataan yang tepat dari gambar di atas adalah …", image: "https://media.quizizz.com/_mdserver/main/media/resource/gs/quizizz-media/quizzes/fa41e0ed-d315-499e-993e-a3f84a37e3de-v2", options: {a: "massa jenis benda lebih besar dari massa jenis cairan", b: "massa jenis benda sama dengan massa jenis cairan", c: "massa jenis air lebih kecil dari massa jenis minyak", d: "massa jenis minyak lebih kecil dari massa jenis airr"}, ans: "d" },
    { q: "Enzim dalam mulut berfungsi untuk . . . .", options: {a: "Protein ke pepton", b: "Protein susu", c: "Zat tepung ke gula", d: "Mengasamkan"}, ans: "c" },
    { q: "Kelelawar memiliki kebiasaan untuk tidur di siang hari dan melakukan aktivitas di malam hari. Kelelawar juga memiliki indra penglihatan yang buruk. Oleh karena itu, kelelawar menggunakan sistem sonar untuk mengenali lingkungan di sekitarnya sehingga kelelawar tidak akan menabrak benda-benda di sekitarnya meskipun kemampuan melihatnya buruk. Kemampuan kelelawar tersebut dikenal dengan kemampuan ...", options: {a: "Adaptasi", b: "Mimikri", c: "Ekolokasi", d: "Autotomi"}, ans: "c" },
    { q: "Tumbuhan kaktus memiliki daun yang berbentuk duri. <br>Fungsi utama dari bentuk daun ini adalah….", options: {a: "Fotosintesis", b: "Mengurangi penguapan", c: "Menyimpan air", d: "Menarik serangga"}, ans: "b" },
    { q: "Lapisan atmosfer bumi yang terdapat lapisan ozon adalah ...", options: {a: "Troposfer", b: "Eksosfer", c: "Stratosfer", d: "Mesosfer"}, ans: "c" },
    { q: "Tumbuhan yang berkembang biak dengan cara tunas adalah….", options: {a: "Mangga", b: "Pisang", c: "Jagung", d: "Kaktus"}, ans: "b" },
    { q: "Dua makhluk hidup yang mempunyai hubungan predasi yaitu ...", options: {a: "Tikus dan kucing", b: "Ular dan landak", c: "Semut dan kupu", d: "Tali putri dengan beluntas"}, ans: "a" },
    { q: "Pertukaran oksigen dan karbondioksida terjadi pada …. ", options: {a: "Tekak", b: "Hidung", c: "Alveolus", d: "Bronkus"}, ans: "c" },
    { q: "Menimbun bagian cabang ke dalam tanah untuk perkembangbiakan disebut …. ", options: {a: "Merunduk", b: "Okulasi", c: "Stek", d: "Mengenten"}, ans: "a" },
    { q: "Bagian darah yang bertugas mengedarkan sari-sari makanan adalah …. ", options: {a: "Sel darah merah", b: "Plasma darah", c: "Keping darah", d: "Sel darah putih"}, ans: "b" }
];

    let currentIdx = 0, userName = "", timeLeft = 20 * 60;
    let userAnswers = new Array(quizData.length).fill(null);
    let timerInterval;

    function startQuiz() {
        userName = document.getElementById('username').value.trim();
        if(!userName) return alert("Silakan isi nama terlebih dahulu!");
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTimer();
        initGrid();
        loadQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("Waktu habis!"); showResult(); }
        }, 1000);
    }

    function initGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        quizData.forEach((_, i) => {
            const el = document.createElement('div');
            el.className = 'nav-num';
            el.id = `nav-${i}`;
            el.innerText = i + 1;
            el.onclick = () => { currentIdx = i; loadQuestion(); };
            grid.appendChild(el);
        });
    }

    function loadQuestion() {
        const data = quizData[currentIdx];
        document.getElementById('progress').innerText = `SOAL ${currentIdx + 1} DARI ${quizData.length}`;
        
        const iBox = document.getElementById('image-box');
        if(data.image && data.image !== "") {
            iBox.src = data.image;
            iBox.classList.remove('hidden');
        } else {
            iBox.classList.add('hidden');
            iBox.src = "";
        }

        const pBox = document.getElementById('passage-box');
        if(data.passage) { pBox.innerHTML = data.passage; pBox.classList.remove('hidden'); }
        else { pBox.classList.add('hidden'); }

        document.getElementById('question-box').innerHTML = data.q;

        const oBox = document.getElementById('options-box');
        oBox.innerHTML = "";
        for(let key in data.options) {
            const btn = document.createElement('button');
            btn.className = 'option' + (userAnswers[currentIdx] === key ? ' selected' : '');
            btn.innerHTML = `<strong>${key.toUpperCase()}.</strong> ${data.options[key]}`;
            btn.onclick = () => {
                userAnswers[currentIdx] = key;
                document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                updateGridStyles();
            };
            oBox.appendChild(btn);
        }

        document.getElementById('prev-btn').style.visibility = (currentIdx === 0) ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = (currentIdx === quizData.length - 1) ? "Selesai" : "Lanjut";
        updateGridStyles();
    }

    function updateGridStyles() {
        quizData.forEach((_, i) => {
            const el = document.getElementById(`nav-${i}`);
            if(el) {
                el.classList.remove('current', 'answered');
                if(i === currentIdx) el.classList.add('current');
                if(userAnswers[i] !== null) el.classList.add('answered');
            }
        });
    }

    function nextQuestion() {
        if(currentIdx < quizData.length - 1) { currentIdx++; loadQuestion(); }
        else { if(confirm("Kumpulkan jawaban sekarang?")) { clearInterval(timerInterval); showResult(); } }
    }

    function prevQuestion() { if(currentIdx > 0) { currentIdx--; loadQuestion(); } }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let correctCount = 0;
        userAnswers.forEach((ans, i) => { if(ans === quizData[i].ans) correctCount++; });
        let score = Math.round((correctCount / quizData.length) * 100);
        document.getElementById('final-score').innerText = score;

        if(DATABASE_URL && DATABASE_URL.includes("script.google.com")) {
            document.getElementById('status-upload').innerText = "⏳ Sedang mengirim nilai...";
            fetch(DATABASE_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: userName, score: score })
            })
            .then(() => {
                document.getElementById('status-upload').innerText = "✅ Nilai Berhasil Terkirim!";
                document.getElementById('status-upload').style.color = "var(--success)";
            })
            .catch(() => {
                document.getElementById('status-upload').innerText = "⚠️ Nilai gagal dikirim ke server.";
                document.getElementById('status-upload').style.color = "var(--danger)";
            });
        }
    }
</script>
</body>
</html>
